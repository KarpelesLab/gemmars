# XcodeGen spec for OxinferTest.xcodeproj (the generated project is committed, so XcodeGen is
# only needed to change it: `cd ios/OxinferTest && xcodegen`).
name: OxinferTest
options:
  bundleIdPrefix: dev.oxinfer
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    # Set your team here or in Xcode (Signing & Capabilities) to run on a device.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  OxinferTest:
    type: application
    platform: iOS
    sources:
      - path: OxinferTest
    dependencies:
      - framework: ../build/Oxinfer.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.oxinfer.OxinferTest
        INFOPLIST_FILE: OxinferTest/Info.plist
        CODE_SIGN_ENTITLEMENTS: OxinferTest/OxinferTest.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        # The Rust static library is arm64 only (Apple-silicon Simulator).
        ARCHS: arm64
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        DEAD_CODE_STRIPPING: YES
