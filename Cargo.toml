[package]
name = "gemmars"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
half = "2.7.1"
memmap2 = "0.9.11"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 1
