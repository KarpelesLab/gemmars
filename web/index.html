<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>oxinfer in the browser</title>
<style>
  :root { color-scheme: light dark; --fg: #222; --bg: #fafafa; --muted: #777; --box: #fff; --line: #ddd; --accent: #2a6; }
  @media (prefers-color-scheme: dark) { :root { --fg: #ddd; --bg: #151515; --muted: #888; --box: #1e1e1e; --line: #333; } }
  body { margin: 0; padding: 16px; font: 15px/1.45 system-ui, sans-serif; color: var(--fg); background: var(--bg); max-width: 900px; margin-inline: auto; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  fieldset { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 0 0 12px; background: var(--box); }
  legend { color: var(--muted); font-size: 13px; padding: 0 4px; }
  label { display: inline-block; margin: 4px 12px 4px 0; }
  input[type=text], input[type=number], select, textarea { font: inherit; padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--fg); }
  input[type=text] { width: min(520px, 100%); }
  textarea { width: 100%; box-sizing: border-box; min-height: 64px; }
  button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--box); color: var(--fg); cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: transparent; }
  button:disabled { opacity: .5; cursor: default; }
  pre { white-space: pre-wrap; word-break: break-word; background: var(--box); border: 1px solid var(--line); border-radius: 8px; padding: 12px; min-height: 80px; margin: 0 0 12px; }
  #log { color: var(--muted); font-size: 12px; max-height: 180px; overflow: auto; }
  progress { width: 100%; height: 10px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
</style>
</head>
<body>
<h1>oxinfer in the browser</h1>
<p>Gemma 4 / Qwen 3.5 inference compiled to WebAssembly (simd128), with prefill matmuls on WebGPU when the browser supports it and JSPI. Everything runs locally; the weights never leave your machine.</p>

<fieldset>
  <legend>Model</legend>
  <div class="row">
    <label>Source URL <input type="text" id="url" placeholder="/models/Qwen--Qwen3.5-0.8B  or  https://huggingface.co/Qwen/Qwen3.5-0.8B/resolve/main"></label>
  </div>
  <div class="row">
    <label>or local folder <input type="file" id="folder" webkitdirectory directory multiple></label>
  </div>
  <div class="row">
    <label>Weights <select id="quant" title="Pre-quantized checkpoints (--save-quantized) carry their own precision"><option value="q4">q4 (smallest)</option><option value="q8" selected>q8</option><option value="bf16">bf16</option></select></label>
    <label><input type="checkbox" id="gpu" checked> WebGPU for prefill</label>
    <label>Prefill chunk <input type="number" id="chunk" value="0" min="0" step="16" style="width:80px" title="0 = default (512 with WebGPU, 256 on CPU)"></label>
    <button class="primary" id="load">Load</button>
  </div>
  <progress id="prog" value="0" max="1" hidden></progress>
  <div id="status" style="color: var(--muted)"></div>
</fieldset>

<fieldset>
  <legend>Chat</legend>
  <textarea id="prompt">Explain what a mitochondrion does in two sentences.</textarea>
  <div class="row" style="margin-top:8px">
    <label>Max tokens <input type="number" id="max" value="256" min="1" style="width:80px"></label>
    <label>Temperature <input type="number" id="temp" value="0" min="0" max="2" step="0.1" style="width:70px"></label>
    <label><input type="checkbox" id="think"> thinking</label>
    <button class="primary" id="send" disabled>Send</button>
    <button id="reset" disabled>New conversation</button>
  </div>
</fieldset>

<pre id="out"></pre>
<div id="stats" style="color: var(--muted); margin-bottom: 12px"></div>
<pre id="log"></pre>

<script type="module">
import { Oxinfer, WebGpuHost, hasJspi, isHostShard } from './oxinfer.js';

const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const auto = params.get('auto') === '1';
const logEl = $('log');
const log = (s) => {
  logEl.textContent += s + '\n';
  logEl.scrollTop = logEl.scrollHeight;
  console.log(s);
  if (auto) fetch('/log', { method: 'POST', body: s }).catch(() => {});
};
const status = (s) => { $('status').textContent = s; };

let g = null;

async function fetchInto(g, base, name, path, onProgress) {
  const url = `${base.replace(/\/$/, '')}/${name}`;
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${url}: HTTP ${r.status}`);
  const size = Number(r.headers.get('content-length') || 0);
  if (isHostShard(name)) {
    // Lookup tables stay in JavaScript memory; the module reads one row per token.
    const bytes = size ? new Uint8Array(size) : null;
    let got = 0;
    if (bytes && r.body) {
      const reader = r.body.getReader();
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        bytes.set(value, got);
        got += value.byteLength;
        onProgress(got, size);
      }
      g.putHostFile(path, bytes);
      return size;
    }
    const all = new Uint8Array(await r.arrayBuffer());
    g.putHostFile(path, all);
    return all.byteLength;
  }
  if (size && r.body) {
    const w = g.putFileStream(path, size);
    const reader = r.body.getReader();
    let got = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      w.write(value);
      got += value.byteLength;
      onProgress(got, size);
    }
    if (got !== size) throw new Error(`${url}: got ${got} of ${size} bytes`);
    w.done();
    return size;
  }
  const bytes = new Uint8Array(await r.arrayBuffer());
  g.putFile(path, bytes);
  onProgress(bytes.byteLength, bytes.byteLength);
  return bytes.byteLength;
}

async function tryJson(base, name) {
  const r = await fetch(`${base.replace(/\/$/, '')}/${name}`);
  return r.ok ? await r.json() : null;
}

async function loadFromUrl(g, base) {
  const files = ['config.json', 'tokenizer.json'];
  if (await tryJson(base, 'generation_config.json')) files.push('generation_config.json');
  const index = await tryJson(base, 'model.safetensors.index.json');
  if (index) {
    files.push('model.safetensors.index.json');
    files.push(...new Set(Object.values(index.weight_map)));
  } else {
    files.push('model.safetensors');
  }
  let total = 0;
  const t0 = performance.now();
  for (const [i, name] of files.entries()) {
    total += await fetchInto(g, base, name, `/model/${name}`, (got, size) => {
      $('prog').value = got / size;
      status(`[${i + 1}/${files.length}] ${name}: ${(got / 1e6).toFixed(0)} / ${(size / 1e6).toFixed(0)} MB`);
    });
  }
  status(`fetched ${(total / 1e9).toFixed(2)} GB in ${((performance.now() - t0) / 1e3).toFixed(1)}s`);
}

async function loadFromFiles(g, fileList) {
  const files = [...fileList].filter((f) => /(^|\/)(config\.json|generation_config\.json|tokenizer\.json|model\.safetensors\.index\.json|.*\.safetensors)$/.test(f.webkitRelativePath || f.name));
  if (!files.length) throw new Error('no model files in that folder');
  let total = 0;
  for (const [i, f] of files.entries()) {
    if (isHostShard(f.name)) {
      g.putHostFile(`/model/${f.name}`, new Uint8Array(await f.arrayBuffer()));
      total += f.size;
      continue;
    }
    const w = g.putFileStream(`/model/${f.name}`, f.size);
    const reader = f.stream().getReader();
    let got = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      w.write(value);
      got += value.byteLength;
      $('prog').value = got / f.size;
      status(`[${i + 1}/${files.length}] ${f.name}: ${(got / 1e6).toFixed(0)} / ${(f.size / 1e6).toFixed(0)} MB`);
    }
    w.done();
    total += f.size;
  }
  status(`read ${(total / 1e9).toFixed(2)} GB`);
}

async function load() {
  $('load').disabled = true;
  $('send').disabled = true;
  $('prog').hidden = false;
  try {
    const wantGpu = $('gpu').checked;
    const gpu = wantGpu ? await WebGpuHost.create(log) : null;
    if (wantGpu && !gpu) log('[webgpu: no adapter; using CPU]');
    if (wantGpu && !hasJspi) log('[webgpu: this browser has no JSPI (WebAssembly.Suspending); GPU disabled]');
    g = await Oxinfer.create('./target/wasm32-unknown-unknown/release/oxinfer_web.wasm', { gpu, log });
    const url = $('url').value.trim();
    const folder = $('folder').files;
    if (folder.length) await loadFromFiles(g, folder);
    else if (url) await loadFromUrl(g, url);
    else throw new Error('give a model URL or pick a folder');
    const t0 = performance.now();
    status('quantizing / preparing weights…');
    await new Promise((r) => setTimeout(r, 0));
    g.load('/model', $('quant').value, { prefillChunk: Number($('chunk').value) || 0 });
    status(`model ready in ${((performance.now() - t0) / 1e3).toFixed(1)}s (${g.gpu ? 'WebGPU prefill + CPU decode' : 'CPU only'})`);
    $('send').disabled = false;
    $('reset').disabled = false;
  } catch (e) {
    log(`[error] ${e.message || e}`);
    status(`failed: ${e.message || e}`);
    $('load').disabled = false;
  } finally {
    $('prog').hidden = true;
  }
}

async function send() {
  const prompt = $('prompt').value;
  if (!g || !prompt.trim()) return;
  $('send').disabled = true;
  $('out').textContent = '';
  g.setSampling({ temperature: Number($('temp').value) || 0, topK: 64, topP: 0.95, seed: Date.now() });
  try {
    const st = await g.generate(prompt, { think: $('think').checked, maxTokens: Number($('max').value) || 256 }, (text) => {
      if (!text.endsWith('�')) $('out').textContent = text;
    });
    $('out').textContent = st.text;
    const line = `prefill ${st.promptTokens} tok in ${st.prefillSecs.toFixed(2)}s = ${(st.promptTokens / st.prefillSecs).toFixed(1)} tok/s | decode ${st.tokens} tok in ${st.decodeSecs.toFixed(2)}s = ${(st.tokens / st.decodeSecs).toFixed(1)} tok/s`;
    $('stats').textContent = line;
    log(`[${line}]`);
    const gs = g.gpuStats();
    if (gs) log(`[gpu: ${gs}]`);
  } catch (e) {
    log(`[error] ${e.message || e}`);
  }
  $('send').disabled = false;
}

$('load').onclick = load;
$('send').onclick = send;
$('reset').onclick = () => { g?.reset(); $('out').textContent = ''; };
$('prompt').onkeydown = (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) send(); };

// Headless / scripted use: ?auto=1&model=/models/X&quant=q8&gpu=1&prompt=...&max=32&chunk=256
if (params.get('model')) $('url').value = params.get('model');
if (params.get('quant')) $('quant').value = params.get('quant');
if (params.get('gpu')) $('gpu').checked = params.get('gpu') === '1';
if (params.get('chunk')) $('chunk').value = params.get('chunk');
if (params.get('prompt')) $('prompt').value = params.get('prompt');
if (params.get('max')) $('max').value = params.get('max');
if (auto) {
  log(`[browser: ${navigator.userAgent}; jspi ${hasJspi}]`);
  await load();
  for (let i = 0; i < Number(params.get('repeat') || 1) && g && !$('send').disabled; i++) {
    g.reset();
    await send();
    log('[output] ' + $('out').textContent.replace(/\n/g, '\\n'));
  }
  await fetch('/exit', { method: 'POST' }).catch(() => {});
}
</script>
</body>
</html>
